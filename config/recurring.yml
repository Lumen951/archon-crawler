development:
  crawl_all_accounts:
    class: CrawlJob
    queue: default
    schedule: every day at 10am
  download_wechat_contents:
    class: WechatContentDownloadJob
    queue: default
    schedule: every day at 2am
  cleanup_old_tasks:
    class: CleanupOldTasksJob
    queue: default
    schedule: every day at 3am
  weread_login_reminder:
    class: FeishuLoginReminderJob
    queue: default
    args: [ "weread" ]
    schedule: every day at 9:30am
  wechat_mp_login_reminder:
    class: FeishuLoginReminderJob
    queue: default
    args: [ "wechat_mp" ]
    schedule: every day at 9:36am

production:
  refresh_activity_counters:
    class: RefreshActivityCountersJob
    queue: default
    schedule: every day at 1am
  crawl_all_accounts:
    class: CrawlJob
    queue: default
    schedule: every day at 10am
  download_wechat_contents:
    class: WechatContentDownloadJob
    queue: default
    schedule: every day at 2am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # validate_api_keys:
  #   class: ValidateApiKeysJob
  #   queue: default
  #   schedule: every hour
  cleanup_old_tasks:
    class: CleanupOldTasksJob
    queue: default
    schedule: every day at 3am
  weread_login_reminder:
    class: FeishuLoginReminderJob
    queue: default
    args: [ "weread" ]
    schedule: every day at 9:30am
  wechat_mp_login_reminder:
    class: FeishuLoginReminderJob
    queue: default
    args: [ "wechat_mp" ]
    schedule: every day at 9:36am
